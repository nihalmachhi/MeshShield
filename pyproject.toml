[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshshield"
version = "0.1.0"
description = "A reproducible research simulator for offline payment fraud risk."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
meshshield = "meshshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

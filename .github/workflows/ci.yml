name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with development extras
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Check formatting
        run: python -m ruff format --check src tests scripts

      - name: Type check
        run: python -m mypy src/meshshield

      - name: Test with coverage
        run: python -m pytest -q --cov=meshshield --cov-report=term-missing --cov-report=xml

      - name: Demo smoke test (standard library only path)
        run: python -m meshshield.cli demo

      - name: Upload measured metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            data/generated/metrics.json
            data/generated/dataset_card.json
          if-no-files-found: warn
          retention-days: 14

  site:
    name: React site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci --prefix site

      - name: Unit test simulation logic
        run: npm test --prefix site

      - name: Build site
        run: npm run build --prefix site

      - name: Check formatting
        run: npm run format:check --prefix site

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag meshshield:ci .

name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Check formatting
        run: python -m ruff format --check src tests scripts
      - name: Type check
        run: python -m mypy src/meshshield
      - name: Test
        run: python -m pytest -q --cov=meshshield --cov-report=term-missing
      - name: Demo smoke test
        run: python -m meshshield.cli demo

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build React site
        run: npm ci --prefix site && npm run build --prefix site
      - name: Check React formatting
        run: npm run format:check --prefix site

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag meshshield:ci .

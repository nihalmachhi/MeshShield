[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshshield"
version = "0.1.0"
description = "A reproducible research simulator for offline payment fraud risk."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["cryptography>=42", "mypy>=1.10", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
data = ["kaggle>=1.6"]
crypto = ["cryptography>=42"]
graph = ["torch>=2.2", "torch-geometric>=2.5"]
boosted = ["xgboost>=2.0"]
anomaly = ["scikit-learn>=1.4"]

[project.scripts]
meshshield = "meshshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
mypy_path = "src"
python_version = "3.11"
strict = true
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
branch = true
source = ["meshshield"]
